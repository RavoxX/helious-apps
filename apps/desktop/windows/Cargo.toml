[package]
name = "helious-windows"
version = "0.9.3"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
build = "build.rs"
[[bin]]
name = "Helious"
path = "src/main.rs"
[dependencies]
helious-native = { path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
base64 = "0.22"
url = "2"
[build-dependencies]
winresource = "0.1"
[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
tempfile = "3"
