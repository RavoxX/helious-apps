[package]
name = "helious-windows"
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
build = "build.rs"
[[bin]]
name = "Helious"
path = "src/main.rs"
[dependencies]
helious-native = { path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui_commonmark = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
[build-dependencies]
winresource = "0.1"
[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
tempfile = "3"
