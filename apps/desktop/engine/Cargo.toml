[package]
name = "helious-native"
version = "0.9.3"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
base64 = "0.22"
unicode-normalization = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "stream"] }
url = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
fs2 = "0.4"
regex = "1"
ed25519-dalek = "2"
semver = "1"
yaml-edit = "=0.3.2"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
latex-rust = "=1.0.5"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
resvg = "0.45"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Storage_Streams", "Win32_System_WinRT"] }
