[package]
name = "helious-native"
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
base64 = "0.22"
unicode-normalization = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "stream"] }
url = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
fs2 = "0.4"
regex = "1"
ed25519-dalek = "2"
semver = "1"
